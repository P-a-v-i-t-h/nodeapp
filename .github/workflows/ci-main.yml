name: node-ci-pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: select the enviroment
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
      port:
        description: select the port
        required: true
        default: "8080"
  

jobs:
  node:
    runs-on: ["Lix-ubuntu"]
  
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        
    - run: npm install

    - name: run application
      run:
          node server.js & {{ github.event.input.environment}} &
          sleep 5
          curl http://localhost:${{ github.event.inputs.port }}
          curl http://localhost:${{ github.event.inputs.port }}/health
          pkill -f "node server.js" ${{ github.event.inputs.environment}}
