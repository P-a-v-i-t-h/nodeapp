name: node ci-pipeline
on:
  push:
    branch: ["main"]

jobs:
  node:
    run on: ["lix-ubuntu"]
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup node
        uses: action/checkout@v7
        with:
          node-version: 24
      
      - name: install packages
        uses: npm install 

      - name: run application
        run:
          node server.js &
          sleep 5
          curl http://localhost:8080
          curl http://localhost:8080/heath 
          pkill -f "node server.js"
